[theme]
# Tennis editorial light theme
primaryColor = "#C96B3B"
backgroundColor = "#F6F1E8"
secondaryBackgroundColor = "#FFF8F0"
textColor = "#19231F"
font = "sans serif"

[client]
showErrorDetails = true
toolbarMode = "viewer"

[logger]
level = "info"

[server]
port = 8502
headless = true
runOnSave = true
maxMessageSize = 200
